<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testing Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
  /* ==========================================================
     COLOURS AND FONTS
     ========================================================== */
  :root {
    --night: #14082a;
    --night-2: #1d0f3d;
    --panel: #2a1650;
    --panel-edge: #5a3fa0;
    --magenta: #ff2a9d;
    --magenta-soft: #ff5cc0;
    --cyan: #2de2e6;
    --orange: #ff9a3c;
    --sun: #ffd319;
    --lilac: #d9c7ff;
    --text: #f3e8ff;
    --text-soft: #cdb8f5;

    --font-display: "Monoton", "Orbitron", "Arial Black", sans-serif;
    --font-tech: "Orbitron", "Eurostile", "Arial", sans-serif;
    --font-body: "VT323", "Courier New", monospace;
  }

  /* ==========================================================
     PAGE
     ========================================================== */
  *, *::before, *::after { box-sizing: border-box; }

  html { background: var(--night); }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1.45rem;
    line-height: 1.3;
    background: linear-gradient(180deg, #1a0b3a 0%, var(--night) 60%);
  }

  /* faint CRT scanlines over everything */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.12) 3px
    );
    z-index: 10;
  }

  a:focus-visible {
    outline: 3px solid var(--cyan);
    outline-offset: 4px;
  }

  .wrap {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding-left: 24px;
    padding-right: 24px;
  }

  /* ==========================================================
     HERO
     ========================================================== */
  .hero {
    position: relative;
    overflow: hidden;
    border-bottom: 3px solid var(--magenta);
    box-shadow: 0 6px 30px rgba(255, 42, 157, 0.45);
  }

  .hero-scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .hero-inner {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1.05fr;
    align-items: center;
    gap: 32px;
    padding-top: 72px;
    padding-bottom: 110px;
  }

  .hero h1 {
    margin: 0 0 20px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2.2rem, 6vw, 4rem);
    line-height: 1.1;
    color: var(--magenta-soft);
    text-shadow:
      0 0 6px var(--magenta),
      0 0 26px rgba(255, 42, 157, 0.6),
      0 4px 8px rgba(11, 6, 24, 0.85);
  }

  .hero p {
    margin: 0;
    max-width: 28ch;
    font-size: 1.7rem;
    color: #efe3ff;
    /* dark halo keeps the text readable over the bright grid lines */
    text-shadow:
      0 0 3px #0b0618,
      0 0 8px #0b0618,
      0 0 16px rgba(11, 6, 24, 0.95),
      2px 2px 0 #0b0618;
  }

  .walkman {
    width: 100%;
    max-width: 540px;
    height: auto;
    justify-self: center;
    transform: rotate(-3deg);
    filter: drop-shadow(0 22px 28px rgba(0, 0, 0, 0.55));
  }

  /* the one moving part: the cassette reels */
  .reel {
    transform-box: fill-box;
    transform-origin: center;
    animation: reel-spin 7s linear infinite;
  }
  @keyframes reel-spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .reel { animation: none; }
  }

  @media (max-width: 820px) {
    .hero-inner {
      grid-template-columns: 1fr;
      padding-top: 48px;
      padding-bottom: 90px;
    }
    .walkman { max-width: 440px; }
  }

  /* ==========================================================
     PROJECTS AREA
     ========================================================== */
  .projects-section {
    padding-top: 56px;
    padding-bottom: 96px;
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 0 0 32px;
    font-family: var(--font-tech);
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 0.06em;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(45, 226, 230, 0.6);
  }
  .section-title::after {
    content: "";
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--orange));
    box-shadow: 0 0 10px rgba(255, 42, 157, 0.6);
  }

  /* ==========================================================
     PROJECT ENTRIES
     Everything below styles every .project card.
     To add a project, copy one <article class="project"> block
     and paste it inside <div class="projects">.
     ========================================================== */
  .projects {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
    gap: 28px;
  }

  .project {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 24px;
    border: 3px solid transparent;
    border-radius: 18px;
    background:
      linear-gradient(160deg, var(--panel), var(--night-2)) padding-box,
      linear-gradient(135deg, var(--magenta), var(--cyan)) border-box;
    box-shadow: 0 0 22px rgba(255, 42, 157, 0.25), 0 14px 24px rgba(0, 0, 0, 0.4);
  }

  /* four corner screws */
  .project::before {
    content: "";
    position: absolute;
    inset: 7px;
    pointer-events: none;
    background:
      radial-gradient(circle at 0 0, #a58be0 0 3px, #3b2670 4px, transparent 5px),
      radial-gradient(circle at 100% 0, #a58be0 0 3px, #3b2670 4px, transparent 5px),
      radial-gradient(circle at 0 100%, #a58be0 0 3px, #3b2670 4px, transparent 5px),
      radial-gradient(circle at 100% 100%, #a58be0 0 3px, #3b2670 4px, transparent 5px);
  }

  /* the screen: holds a placeholder now, or an <img> later */
  .project-image {
    position: relative;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border: 6px solid #0b0618;
    border-radius: 12px;
    background: #12092a;
    box-shadow: 0 0 0 2px var(--panel-edge), inset 0 0 18px rgba(45, 226, 230, 0.35);
  }
  .project-image::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0,
      rgba(0, 0, 0, 0) 3px,
      rgba(0, 0, 0, 0.22) 4px
    );
  }
  .project-image img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .project-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    height: 100%;
    font-family: var(--font-tech);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    color: #9ad9e0;
    background: linear-gradient(180deg, #2b1055 0%, #12092a 100%);
  }
  .project-placeholder svg { width: 72px; height: auto; }

  .project-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .project-title {
    margin: 0;
    font-family: var(--font-tech);
    font-weight: 700;
    font-size: 1.3rem;
    letter-spacing: 0.04em;
    color: var(--sun);
    text-shadow: 0 0 10px rgba(255, 211, 25, 0.45);
  }

  .project-description {
    margin: 0;
    flex: 1;
    font-size: 1.45rem;
    color: var(--text-soft);
  }

  /* chunky transport-style button */
  .project-link {
    align-self: flex-start;
    margin-top: 6px;
    padding: 12px 22px;
    font-family: var(--font-tech);
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    text-decoration: none;
    color: #fff;
    border-radius: 8px;
    background: linear-gradient(180deg, #ff5cc0, #d4107f);
    box-shadow: 0 5px 0 #7a0a49, 0 8px 16px rgba(255, 42, 157, 0.45);
    transition: filter 0.15s;
  }
  .project-link:hover { filter: brightness(1.15); }
  .project-link:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #7a0a49, 0 4px 10px rgba(255, 42, 157, 0.45);
  }

  /* ==========================================================
     FOOTER STRIPES
     ========================================================== */
  .stripes { height: 18px; background:
    linear-gradient(var(--magenta) 0 6px, var(--orange) 6px 12px, var(--cyan) 12px 18px); }
</style>
</head>
